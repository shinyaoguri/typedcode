name: Release

# beta 版の日次の自動採番 (#843 / ADR-0055 の決定 2・4)。
#
# 毎日 1 回、staging への配信と実 URL の E2E まで通った main のコミット (Deploy の main push の run が success)
# のうち最新のものに `vYYYY.M.0-beta.N` のタグを打ち、prerelease の GitHub Release を作る (Latest にしない)。
# 版とコミットの決め方は scripts/release.mjs beta、ノートは scripts/release.mjs notes。
#
# 見送り: 最新のタグ以降に fix / feat が無い・Deploy が success のコミットが無い・main の最新の完了 nightly が
# success でない、のどれかなら、理由を ::notice:: と job summary に出して緑で終える (nightly の失敗は
# nightly 自身が Issue に集めているので、ここでは赤にしない)。git・API の失敗は赤にする。
#
# 既定のトークン (GITHUB_TOKEN) が作ったタグの push は他のワークフローを起こさない。beta 形のタグでは
# production へ配信しない (deploy.yml の nightly-gate / deploy-production は `-` を含むタグで走らない)。
# 打ったタグは消せない (ruleset)。打ち間違えたら消さずに、次の番号で前へ進める。
on:
  schedule:
    # 05:47 JST。nightly (18:30 UTC 開始・上限 100 分) の後
    - cron: '47 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: タグを打たず、選ぶコミット・版・ノートだけを出す
        type: boolean
        default: false

permissions:
  contents: read

# 同時の run が同じ版を決めないよう、1 本ずつ走らせる (走っている run は止めない)
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # 最新のタグ・タグ以降の履歴・既存の beta タグを読むため全履歴とタグが要る
          fetch-depth: 0
          persist-credentials: false

      # release.mjs と nightly-gate.mjs は Node の標準ライブラリだけを使うので npm ci は要らない
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Require latest completed main nightly to succeed
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/nightly-gate.log"
          code=0
          node scripts/nightly-gate.mjs > "$log" 2>&1 || code=$?
          cat "$log"
          # 0 = 通過、1 = 判定の結果 (nightly が赤・完了 run なし) = 見送り、それ以外 = 判定できなかった = 失敗
          case "$code" in
            0)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "::notice title=beta 版を見送り::main の最新の完了 nightly が success でない (詳細は job summary)"
              {
                echo "## beta 版を見送り"
                echo
                echo "main の最新の完了 nightly が success でない。"
                echo
                echo '```'
                cat "$log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$code"
              ;;
          esac

      # exit 0 = 出す (stdout の tag= / sha= をそのまま output に)、3 = 見送り、それ以外 = 失敗
      - name: Decide the next beta version
        id: plan
        if: steps.nightly.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/plan.out"
          err="${RUNNER_TEMP}/plan.err"
          code=0
          node scripts/release.mjs beta > "$out" 2> "$err" || code=$?
          cat "$out"
          cat "$err" >&2
          case "$code" in
            0)
              cat "$out" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            3)
              reason="$(head -n 1 "$err")"
              echo "::notice title=beta 版を見送り::${reason}"
              {
                echo "## beta 版を見送り"
                echo
                echo "$reason"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$code"
              ;;
          esac

      - name: Build release notes
        if: steps.plan.outputs.skip == 'false'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/notes.md"
          node scripts/release.mjs notes --to "$SHA" > "$notes"
          {
            echo "## ${TAG} (\`${SHA}\`) のノート"
            echo
            cat "$notes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the beta prerelease
        if: steps.plan.outputs.skip == 'false' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --target "$SHA" --prerelease --latest=false --title "$TAG" --notes-file "${RUNNER_TEMP}/notes.md"

      - name: Report the dry run
        if: steps.plan.outputs.skip == 'false' && inputs.dry_run
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -euo pipefail
          echo "dry_run: ${TAG} を ${SHA} に打つはずだった (打っていない)"
          {
            echo "## dry_run"
            echo
            echo "タグは打っていない。打つはずだったタグ: \`${TAG}\`、コミット: \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
