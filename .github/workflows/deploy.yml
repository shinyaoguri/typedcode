name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# デフォルトは read-only。デプロイ等が必要な job は各 job の permissions で個別に昇格する
# (161 / 260 / 321 行目付近)。リポジトリ設定は既に default_workflow_permissions: read だが、
# 将来の設定変更に対する防御として明示する。
permissions:
  contents: read

# ref ごとに 1 run。PR は新しい push で古い run をキャンセル (CI 節約)。
# push (= deploy) は cancel-in-progress が false なので、実行中の run は途中でキャンセルしない。
# 同じグループで待機中の古い run は、新しい run が来るとキャンセルされ最新だけが残る
# (キューに積まれて全部走るわけではない)。最新 run が最後に走るので
# 「古い deploy が後から完了して新しい成果物を上書きする」競合を防ぐ。
# 本番デプロイを途中キャンセルしないため cancel-in-progress は PR のみ true。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 構成 (タグ式 GitHub Flow, ADR-0028):
#   test                   — どのトリガでも必ず走る (test:coverage を持つ全 workspace のユニットテスト + カバレッジの床)
#   check                  — どのトリガでも必ず走る (全 package typecheck/build + Worker config dry-run)
#   deploy-preview         — feature → main PR で Pages のプレビュー URL を発行 (Workers staging 向け)
#   deploy-staging         — main push で Workers staging + Pages staging (--branch=staging) を更新
#   deploy-production      — v* タグ push で Workers production + Pages production を更新
#                            (GitHub Environment "production" の Required reviewers で承認待ち)
#
# 設計判断:
#   - 本番は手動承認ゲート前提。main = staging で動作確認 → v* タグ (gh release create) → 承認 → 本番。
#   - タグ push でも test/check/e2e を再実行する (リリースゲート)。タグは CI 未通過の
#     コミットにも打ててしまうため、タグ時の再検証が唯一の強制ゲートになる。
#   - Pages の Cloudflare バンドルは VITE_API_URL が baked-in なので、
#     ターゲットごとに build を回す (staging build と production build が別物)。

jobs:
  # --------------------------------------------------------------------
  # 共通テスト
  # --------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      # `test:coverage` script を持つ全 workspace のユニットテストをカバレッジ付きで回す
      # (#156 / ADR-0034)。パッケージ名の個別列挙だと新パッケージのテストが CI 外に取り残される
      # (editor がそうなっていた)。各 vitest.config.ts の coverage.thresholds (実測値の床) を
      # 下回ると落ちるので「テストが減らない」ことをここで強制する。床の引き上げは手元の
      # `npm run coverage:ratchet`。e2e は `test` のみで `test:coverage` を持たないため誤って拾わない。
      # `--if-present` は test:coverage を持たない workspace を黙って飛ばすので、
      # test:run だけ持つ新パッケージがカバレッジ計測ごと CI から漏れないようここで落とす。
      - name: Require test:coverage alongside test:run
        run: |
          # shellcheck disable=SC2016 # JS のテンプレートリテラル (`...${x}`) をシェルに展開させないための意図した単一引用符
          node -e '
            const fs = require("node:fs");
            const missing = fs.readdirSync("packages")
              .map((d) => `packages/${d}/package.json`)
              .filter((p) => fs.existsSync(p))
              .filter((p) => { const s = JSON.parse(fs.readFileSync(p, "utf8")).scripts ?? {}; return s["test:run"] && !s["test:coverage"]; });
            if (missing.length) { console.error(`::error::test:run があるのに test:coverage が無い: ${missing.join(", ")}`); process.exit(1); }
          '

      - name: Run unit tests with coverage (all workspaces with test:coverage)
        run: npm run test:coverage --workspaces --if-present

  # --------------------------------------------------------------------
  # 品質ゲート (merge 前に全 package を typecheck/build + Worker config 検証)
  # build は従来 deploy job で初めて走っていたため、main に入ってから
  # 失敗する余地があった。push/PR どちらでも走らせ deploy の前提条件にする。
  # secrets 不要 (VITE_* 無しでも build は通る / wrangler は --dry-run)。
  # --------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Typecheck (all packages)
        run: npm run typecheck

      - name: Lint & format check (Biome)
        run: npm run lint

      # workflow の式・イベント名・run: のシェルを actionlint + shellcheck (版と sha256 を固定) で検査する。
      # pull_request_target / schedule の workflow は壊れていても PR が緑のまま空振りするため (#351)。
      - name: Lint workflows (actionlint + shellcheck)
        run: npm run lint:workflows

      # PR ゲート (pr-checks.yml の require-tests / require-visual-evidence) の判定ロジックのテスト
      # (ADR-0034 / ADR-0036)。pr-checks.yml は pull_request_target で base 側のスクリプトを実行するので、
      # PR で変えたロジックはここで検査する。scripts/sweep.test.ts (vitest・使い捨てリポジトリの
      # 統合テスト) は CI 常設にしないので、glob を *.test.mjs に絞って外している。
      - name: Test PR gate scripts (node:test)
        run: node --test 'scripts/*.test.mjs'

      - name: Build (all packages)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # verify-cli の配布物 (esbuild bundle) を素の node で起動する smoke (#298)。
      # tsx で src を叩くユニット / e2e では dist の解決失敗が隠れるので、build 直後にここで見る。
      - name: Smoke-test verify-cli dist (plain node)
        run: npm run test:dist -w @typedcode/verify-cli

      - name: Validate Worker config (staging dry-run)
        run: npm run deploy:staging -w @typedcode/workers -- --dry-run --outdir /tmp/wrangler-dryrun-staging

      - name: Validate Worker config (production dry-run)
        run: npm run deploy:production -w @typedcode/workers -- --dry-run --outdir /tmp/wrangler-dryrun-production

  # --------------------------------------------------------------------
  # E2E (ブラウザ round-trip): 実物のエディタを動かして証明を出力し verify-cli と検証 Web で検証する。
  # workers(wrangler dev) + editor(vite dev) + verify(vite dev) を Playwright が起動。Turnstile は
  # Cloudflare 公開テストキー、checkpoint 署名鍵は実行時に新規生成 (秘密はコミットしない)。
  # コピペ/フルスクリーン等のブラウザ依存挙動もここで自動検証していく。
  # 本番ビルド (vite preview) のスモーク (#255) は shard 1 だけで踏む。
  #
  # spec の増加 (#346) を吸収するため Playwright の --shard で 2 分割して並列に走らせる。
  # matrix の job の check 名は `e2e (shard 1/2)` のように変わるので、required check と
  # deploy-* の `needs: [test, check, e2e]` が参照する `e2e` は下の集約 job が名乗る。
  # --------------------------------------------------------------------
  e2e-shard:
    name: e2e (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # e2e は wrangler dev + vite dev を Playwright が起動する構成でハングの余地があり、
    # 過去に PoSW full 検証でタイムアウト間際になった実績もある (a6079d0)。
    # 実測 ~7 分 (分割前の全体。--mode fast 整合 + workers:2 後。full は happy-path のみ)。
    timeout-minutes: 30
    strategy:
      # 片方の shard が落ちても、もう片方の失敗も見えるよう最後まで走らせる。
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Provision E2E env (test keys + 生成 checkpoint 鍵)
        run: npm run setup -w @typedcode/e2e

      # キーには Playwright のバージョンを含める。package-lock.json のハッシュだけだと
      # Playwright と無関係な依存更新でもキャッシュが無効化されてしまうため、
      # `npx playwright --version` (インストール済み @playwright/test の CLI) が
      # 報告する実バージョンを切り出してキーに使う (package.json の ^1.62.0 のような
      # 範囲指定ではなく、実際に解決されたバージョンで判定するため)。
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      # キャッシュヒット時も install は実行したままにする。ブラウザ本体が揃っていれば
      # 即座に終わる一方、--with-deps が入れる OS 依存パッケージ (apt) はキャッシュの
      # 対象外 (~/.cache/ms-playwright に含まれない) なので毎回必要。
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E shard ${{ matrix.shard }}/2 (editor → export → verify-cli / verify Web)
        run: npm run test -w @typedcode/e2e -- --shard=${{ matrix.shard }}/2

      # 本番ビルド (vite build → vite preview) のスモーク。上の round-trip は
      # vite dev サーバに対して走るため、バンドル変換やチャンク分割に起因する退行を
      # 原理的に検出できない (#255)。editor と verify (/verify/) の dist を実際に配信して踏む。
      # 2 本だけなので shard 1 に寄せる (両 shard で build を二重に回さない)。
      - name: Run production-build smoke (vite build → vite preview)
        if: matrix.shard == 1
        run: npm run test:build -w @typedcode/e2e
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # shard ごとに名前を分ける (同名だと 2 つ目のアップロードが衝突して失敗する)。
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          retention-days: 7

  # 全 shard の成否を 1 つの check `e2e` に集約する。main の ruleset の required check と
  # deploy-* の `needs: [..., e2e]` はこの名前を見る。`if: always()` が無いと shard の失敗時に
  # この job が skipped になり、ruleset 上は skipped が「通過」扱いになってしまう。
  e2e:
    needs: [e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every E2E shard to succeed
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e-shard result: $SHARD_RESULT"
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::E2E shard が成功していない (result=$SHARD_RESULT)"
            exit 1
          fi

  # --------------------------------------------------------------------
  # PR: Pages プレビューデプロイ (Workers は触らない)
  # PR ビルドは staging API を指す。
  # --------------------------------------------------------------------
  deploy-preview:
    needs: [test, check, e2e]
    # head_ref != 'staging' で `staging` という名前のブランチを除外する。
    # deploy-staging が --branch=staging で `staging.<project>.pages.dev` にデプロイ
    # するため、同名 head の PR preview が走ると URL が衝突して staging を上書きする。
    # (`staging` はブランチ名として予約。CONTRIBUTING.md 参照)
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.head_ref != 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build (staging API)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Merge build outputs
        run: |
          mkdir -p ./dist
          cp -r ./packages/editor/dist/* ./dist/
          cp -r ./packages/verify/dist ./dist/verify

      - name: Deploy to Cloudflare Pages (Preview)
        id: preview-deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-message を明示的に ASCII で渡す。CF Pages API は非 ASCII
          # コミットメッセージを 8000111 で拒否することがあるため (wrangler issue)、
          # SHA を message として送って追跡性を保つ。
          #
          # ここは ${{ }} の直接展開のままでよい (#239 で「env 経由に変えるべき」と
          # 指摘されたが、実測の結果その前提が誤りだった)。wrangler-action v4 は
          # command: を **シェルに渡さず**トークン分割して npx を直接 exec する。
          # 実測: env で $CF_PROJECT_NAME を渡すと wrangler がプロジェクト名として
          # 文字列 "$CF_PROJECT_NAME" を受け取り deploy が失敗する。
          # シェルが介在しないので head_ref の `;` `$` バッククォートは不活性であり、
          # git はブランチ名に空白を許さないため引数分割も起きない。
          # **env 経由に「直す」とデプロイが壊れる。**
          command: pages deploy ./dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.head_ref }} --commit-hash=${{ github.sha }} --commit-message="${{ github.sha }}"

      - name: Comment PR with preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # wrangler の出力にバッククォートや `${` が混ざると、テンプレートリテラルへの
        # 直接展開ではスクリプトごと壊れて job が落ちる。env: 経由で渡し、
        # process.env 参照にすることで出力内容に関わらず安全に扱う。
        env:
          PREVIEW_DEPLOY_OUTPUT: ${{ steps.preview-deploy.outputs.command-output }}
        with:
          script: |
            const output = process.env.PREVIEW_DEPLOY_OUTPUT;
            const urlMatch = output.match(/https:\/\/[^\s]+\.pages\.dev/);
            const previewUrl = urlMatch ? urlMatch[0] : null;

            if (!previewUrl) {
              console.log('Could not extract preview URL from output:', output);
              return;
            }

            const body = `## 🚀 Preview Deployment

            | Name | URL |
            |------|-----|
            | Preview | ${previewUrl} |

            *Deployed from commit ${context.sha.substring(0, 7)}*
            *API: staging Workers*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## 🚀 Preview Deployment')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # --------------------------------------------------------------------
  # main push: staging 環境 (Workers + Pages) を更新
  # 自動デプロイ。承認ゲートなし。main = 常時統合ブランチ (ADR-0028)。
  # --------------------------------------------------------------------
  deploy-staging:
    needs: [test, check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build (staging API)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Merge build outputs
        run: |
          mkdir -p ./dist
          cp -r ./packages/editor/dist/* ./dist/
          cp -r ./packages/verify/dist ./dist/verify

      - name: Deploy Workers (Staging)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/workers
          command: deploy --config wrangler.staging.toml

      - name: Deploy to Cloudflare Pages (Staging)
        # --branch=staging で staging.<project>.pages.dev という stable URL になる。
        # --branch=main は Pages プロジェクトの production branch と衝突する
        # (production デプロイ扱いになる) ため使わない。
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=staging --commit-hash=${{ github.sha }} --commit-message="${{ github.sha }}"

  # --------------------------------------------------------------------
  # v* タグ push: production 環境 (Workers + Pages) を更新
  # リリース = `gh release create vX.Y.Z` によるタグ作成 (CONTRIBUTING.md 参照)。
  # GitHub Environment "production" の Required reviewers で承認待ち。
  # --------------------------------------------------------------------
  deploy-production:
    needs: [test, check, e2e]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    # 注: Environment "production" の承認待ち時間は timeout-minutes に含まれない
    # (job 開始 = 承認後)。実行時間のみの上限。
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # ancestor ガード (下) が main との祖先関係を辿るため全履歴を取得する
          fetch-depth: 0

      # タグは任意のコミットに打てるため、main の履歴上のコミットであることを検証する。
      # main に載っていないコミットへのタグでは本番デプロイを拒否する。
      - name: Verify tag commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build (production API)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Merge build outputs
        run: |
          mkdir -p ./dist
          cp -r ./packages/editor/dist/* ./dist/
          cp -r ./packages/verify/dist ./dist/verify

      - name: Deploy Workers (Production)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/workers
          command: deploy --config wrangler.production.toml

      - name: Deploy to Cloudflare Pages (Production)
        # --branch=main (= Pages プロジェクトの production branch) を明示する。
        # タグ checkout は detached HEAD になり branch 推定が効かないため、
        # 省略すると preview デプロイ扱いになって本番 URL が更新されない。
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.sha }}"
