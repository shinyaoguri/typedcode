name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# デフォルトは read-only。デプロイ等が必要な job は各 job の permissions で個別に昇格する
# (deploy-staging / deploy-production)。リポジトリ設定は既に default_workflow_permissions: read だが、
# 将来の設定変更に対する防御として明示する。
permissions:
  contents: read

# ref ごとに 1 run。PR は新しい push で古い run をキャンセル (CI 節約)。
# push (= deploy) は cancel-in-progress が false なので、実行中の run は途中でキャンセルしない。
# 同じグループで待機中の古い run は、新しい run が来るとキャンセルされ最新だけが残る
# (キューに積まれて全部走るわけではない)。最新 run が最後に走るので
# 「古い deploy が後から完了して新しい成果物を上書きする」競合を防ぐ。
# 本番デプロイを途中キャンセルしないため cancel-in-progress は PR のみ true。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 構成 (タグ式 GitHub Flow, ADR-0028):
#   test                   — どのトリガでも必ず走る (test:coverage を持つ全 workspace のユニットテスト + カバレッジの床)
#   check                  — どのトリガでも必ず走る (全 package typecheck/build + Worker config dry-run)
#   build-preview          — feature → main PR で Pages プレビューを build して artifact に上げる
#                            (secrets を持たない。プレビュー URL の発行は deploy-preview.yml。#582)
#   deploy-staging         — main push で Workers staging + Pages staging (--branch=staging) を更新
#   e2e-staging            — deploy-staging の後に、その deploy の Pages の URL をブラウザで round-trip する
#                            (packages/e2e の test:deployed。secrets を持たない。production には無い。#655)
#   deploy-production      — v* タグ push で Workers production + Pages production を更新
#                            (GitHub Environment "production" の Required reviewers で承認待ち)
#
# 設計判断:
#   - 本番は手動承認ゲート前提。main = staging で動作確認 → v* タグ (gh release create) → 承認 → 本番。
#   - タグ push でも test/check/e2e を再実行する (リリースゲート)。タグは CI 未通過の
#     コミットにも打ててしまうため、タグ時の再検証が唯一の強制ゲートになる。
#   - Pages の Cloudflare バンドルは VITE_API_URL が baked-in なので、
#     ターゲットごとに build を回す (staging build と production build が別物)。

jobs:
  # --------------------------------------------------------------------
  # 共通テスト
  # --------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      # `test:coverage` script を持つ全 workspace のユニットテストをカバレッジ付きで回す
      # (#156 / ADR-0034)。パッケージ名の個別列挙だと新パッケージのテストが CI 外に取り残される
      # (editor がそうなっていた)。各 vitest.config.ts の coverage.thresholds (実測値の床) を
      # 下回ると落ちるので「テストが減らない」ことをここで強制する。床の引き上げは手元の
      # `npm run coverage:ratchet`。e2e は `test` のみで `test:coverage` を持たないため誤って拾わない。
      # `--if-present` は test:coverage を持たない workspace を黙って飛ばすので、
      # test:run だけ持つ新パッケージがカバレッジ計測ごと CI から漏れないようここで落とす。
      - name: Require test:coverage alongside test:run
        run: |
          # shellcheck disable=SC2016 # JS のテンプレートリテラル (`...${x}`) をシェルに展開させないための意図した単一引用符
          node -e '
            const fs = require("node:fs");
            const missing = fs.readdirSync("packages")
              .map((d) => `packages/${d}/package.json`)
              .filter((p) => fs.existsSync(p))
              .filter((p) => { const s = JSON.parse(fs.readFileSync(p, "utf8")).scripts ?? {}; return s["test:run"] && !s["test:coverage"]; });
            if (missing.length) { console.error(`::error::test:run があるのに test:coverage が無い: ${missing.join(", ")}`); process.exit(1); }
          '

      - name: Run unit tests with coverage (all workspaces with test:coverage)
        run: npm run test:coverage --workspaces --if-present

  # --------------------------------------------------------------------
  # 品質ゲート (merge 前に全 package を typecheck/build + Worker config 検証)
  # build は従来 deploy job で初めて走っていたため、main に入ってから
  # 失敗する余地があった。push/PR どちらでも走らせ deploy の前提条件にする。
  # secrets 不要 (VITE_* 無しでも build は通る / wrangler は --dry-run)。
  # --------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Typecheck (all packages)
        run: npm run typecheck

      - name: Lint & format check (Biome)
        run: npm run lint

      # workflow の式・イベント名・run: のシェルを actionlint + shellcheck (版と sha256 を固定) で検査する。
      # pull_request_target / schedule の workflow は壊れていても PR が緑のまま空振りするため (#351)。
      - name: Lint workflows (actionlint + shellcheck)
        run: npm run lint:workflows

      # README の依存表 (パッケージ名と用途だけ。版は書かない) と package.json を名前で突き合わせる (#269)。
      # dependencies を足して README に書かない PR / 消えた依存が表に残った PR を落とす。
      # dependabot PR は依存の増減をしないので落ちない。
      - name: Check README dependency tables
        run: node scripts/check-deps.mjs

      # vitest を持たない場所のスクリプトのテスト (node:test)。
      # - scripts/*.test.mjs: PR ゲート (pr-checks.yml の require-tests / require-visual-evidence /
      #   require-issue) の判定ロジック (ADR-0034 / ADR-0036 / ADR-0038)。pr-checks.yml は
      #   pull_request_target で base 側のスクリプトを実行するので、PR で変えたロジックはここで検査する。scripts/sweep.test.ts (vitest・使い捨て
      #   リポジトリの統合テスト) は CI 常設にしないので、glob を *.test.mjs に絞って外している。
      # - scripts/ensure-local-keys.test.mjs: gitignore 済みの localKeys.ts を .example から作る処理と、
      #   それが追跡されず ignore されていること (#338)。
      # - scripts/worktree-id.test.mjs: dev サーバが名乗る作業ツリーの識別子 (#552)。
      # - packages/e2e/scripts/*.test.mjs:
      #   - setup-env: e2e の環境準備。既存の .dev.vars の署名鍵と localKeys.ts の食い違いを検知する (#388)。
      #     setup の後も git status が clean であること (#338)
      #   - server-identity: e2e が使う dev サーバがこの作業ツリーのものかの照合 (#552)
      - name: Test scripts (node:test)
        run: node --test 'scripts/*.test.mjs' 'packages/e2e/scripts/*.test.mjs'

      - name: Build (all packages)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # verify-cli の配布物 (esbuild bundle) を素の node で起動する smoke (#298)。
      # tsx で src を叩くユニット / e2e では dist の解決失敗が隠れるので、build 直後にここで見る。
      - name: Smoke-test verify-cli dist (plain node)
        run: npm run test:dist -w @typedcode/verify-cli

      - name: Validate Worker config (staging dry-run)
        run: npm run deploy:staging -w @typedcode/workers -- --dry-run --outdir /tmp/wrangler-dryrun-staging

      - name: Validate Worker config (production dry-run)
        run: npm run deploy:production -w @typedcode/workers -- --dry-run --outdir /tmp/wrangler-dryrun-production

  # --------------------------------------------------------------------
  # E2E (ブラウザ round-trip): 実物のエディタを動かして証明を出力し verify-cli と検証 Web で検証する。
  # workers(wrangler dev) + editor(vite dev) + verify(vite dev) を Playwright が起動。Turnstile は
  # Cloudflare 公開テストキー、checkpoint 署名鍵は実行時に新規生成 (秘密はコミットしない)。
  # コピペ/フルスクリーン等のブラウザ依存挙動もここで自動検証していく。
  # 本番ビルド (vite preview) のスモーク (#255) は shard 1 だけで踏む。
  #
  # spec の増加 (#346) を吸収するため Playwright の --shard で 2 分割して並列に走らせる。
  # matrix の job の check 名は `e2e (shard 1/2)` のように変わるので、required check と
  # deploy-* の `needs: [test, check, e2e]` が参照する `e2e` は下の集約 job が名乗る。
  # --------------------------------------------------------------------
  e2e-shard:
    name: e2e (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # e2e は wrangler dev + vite dev を Playwright が起動する構成でハングの余地があり、
    # 過去に PoSW full 検証でタイムアウト間際になった実績もある (a6079d0)。
    # 実測 ~7 分 (分割前の全体。--mode fast 整合 + workers:2 後。full は happy-path のみ)。
    timeout-minutes: 30
    strategy:
      # 片方の shard が落ちても、もう片方の失敗も見えるよう最後まで走らせる。
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Provision E2E env (test keys + 生成 checkpoint 鍵)
        run: npm run setup -w @typedcode/e2e

      # キーには Playwright のバージョンを含める。package-lock.json のハッシュだけだと
      # Playwright と無関係な依存更新でもキャッシュが無効化されてしまうため、
      # `npx playwright --version` (インストール済み @playwright/test の CLI) が
      # 報告する実バージョンを切り出してキーに使う (package.json の ^1.62.0 のような
      # 範囲指定ではなく、実際に解決されたバージョンで判定するため)。
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      # キャッシュヒット時も install は実行したままにする。ブラウザ本体が揃っていれば
      # 即座に終わる一方、--with-deps が入れる OS 依存パッケージ (apt) はキャッシュの
      # 対象外 (~/.cache/ms-playwright に含まれない) なので毎回必要。
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E shard ${{ matrix.shard }}/2 (editor → export → verify-cli / verify Web)
        run: npm run test -w @typedcode/e2e -- --shard=${{ matrix.shard }}/2

      # 本番ビルド (vite build → vite preview) のスモーク。上の round-trip は
      # vite dev サーバに対して走るため、バンドル変換やチャンク分割に起因する退行を
      # 原理的に検出できない (#255)。editor と verify (/verify/) の dist を実際に配信して踏む。
      # 2 本だけなので shard 1 に寄せる (両 shard で build を二重に回さない)。
      - name: Run production-build smoke (vite build → vite preview)
        if: matrix.shard == 1
        run: npm run test:build -w @typedcode/e2e
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # shard ごとに名前を分ける (同名だと 2 つ目のアップロードが衝突して失敗する)。
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          retention-days: 7

  # 全 shard の成否を 1 つの check `e2e` に集約する。main の ruleset の required check と
  # deploy-* の `needs: [..., e2e]` はこの名前を見る。`if: always()` が無いと shard の失敗時に
  # この job が skipped になり、ruleset 上は skipped が「通過」扱いになってしまう。
  e2e:
    needs: [e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every E2E shard to succeed
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e-shard result: $SHARD_RESULT"
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::E2E shard が成功していない (result=$SHARD_RESULT)"
            exit 1
          fi

  # --------------------------------------------------------------------
  # PR: Pages プレビューの build (Workers は触らない。PR ビルドは staging API を指す)
  #
  # **この job は secrets.* を一切参照しない** (#582)。npm ci の install script と build は PR が
  # 書いたコードで、`$GITHUB_ENV` / `$GITHUB_PATH` に書けば同じ job の後続 step を乗っ取れる。
  # 以前はここで staging の CLOUDFLARE_API_TOKEN を使って `pages deploy` していたが、Cloudflare の
  # API トークンはアカウント単位でしか絞れず、本番と共通の Pages プロジェクトへ書ける。
  # そのため build の成果物を artifact (preview-dist) に上げるだけで終わり、トークンを使う
  # `pages deploy` と PR へのコメントは deploy-preview.yml (workflow_run。default branch の
  # 定義で動き、PR のコードを checkout も実行もしない) が行う。
  #
  # VITE_API_URL / VITE_TURNSTILE_SITE_KEY はバンドルに埋め込まれる公開値なので、トークンを
  # 持たない GitHub 環境 `preview` の variables (vars.*) から読む。値は staging と同じ
  # (staging Workers の URL と staging の Turnstile site key)。
  # --------------------------------------------------------------------
  build-preview:
    needs: [test, check, e2e]
    # head_ref != 'staging' で `staging` という名前のブランチを除外する。
    # deploy-staging が --branch=staging で `staging.<project>.pages.dev` にデプロイ
    # するため、同名 head の PR preview が走ると URL が衝突して staging を上書きする。
    # (`staging` はブランチ名として予約。CONTRIBUTING.md 参照)
    # deploy-preview.yml 側でも同じ条件 (dependabot・staging・fork) を検査し直す。
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.head_ref != 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 公開値の variables だけを持つ環境。secrets は置かない (置くと PR のコードに渡る)。
    # deployment: false で、環境の variables は使うが GitHub の deployment は作らない。
    # この job はビルドしかしないので、「preview へデプロイした」と記録されると実際の公開
    # (deploy-preview.yml) と食い違う。preview の deployment は deploy-preview.yml が作る (#667)。
    environment:
      name: preview
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build (staging API)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Merge build outputs
        run: |
          mkdir -p ./dist
          cp -r ./packages/editor/dist/* ./dist/
          cp -r ./packages/verify/dist ./dist/verify

      # deploy-preview.yml が run-id を指定してこの名前で落とす。名前を変えるときは両方を揃える。
      - name: Upload preview build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: ./dist/
          if-no-files-found: error
          retention-days: 3

  # --------------------------------------------------------------------
  # main push: staging 環境 (Workers + Pages) を更新
  # 自動デプロイ。承認ゲートなし。main = 常時統合ブランチ (ADR-0028)。
  # --------------------------------------------------------------------
  deploy-staging:
    needs: [test, check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # url は GitHub の Deployments と PR 画面の「View deployment」に出る公開先 (#667)。
    # 固定値で書く: Pages のプロジェクト名が secret (CLOUDFLARE_PROJECT_NAME) なので、wrangler の
    # 出力から組むとログの伏せ字 (***) が混ざり URL が壊れ得る。
    environment:
      name: staging
      url: https://staging.typedcode.pages.dev
    permissions:
      contents: read
      deployments: write
    # e2e-staging がこの deploy の Pages を開くための、deployment ごとのサブドメイン (`<label>.<project>.pages.dev`
    # の `<label>`)。URL そのもの (wrangler-action の deployment-url) を出さないのは、プロジェクト名が
    # secrets.CLOUDFLARE_PROJECT_NAME に入っていて URL がその値を含み、secret を含む job output は
    # GitHub が渡さない (redact して空になる) ため (#655)。
    outputs:
      pages-deployment-label: ${{ steps.pages-label.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build (staging API)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Merge build outputs
        run: |
          mkdir -p ./dist
          cp -r ./packages/editor/dist/* ./dist/
          cp -r ./packages/verify/dist ./dist/verify

      - name: Deploy Workers (Staging)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/workers
          command: deploy --config wrangler.staging.toml

      - name: Deploy to Cloudflare Pages (Staging)
        id: pages-deploy
        # --branch=staging で staging.<project>.pages.dev という stable URL になる。
        # --branch=main は Pages プロジェクトの production branch と衝突する
        # (production デプロイ扱いになる) ため使わない。
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=staging --commit-hash=${{ github.sha }} --commit-message="${{ github.sha }}"

      # wrangler-action の deployment-url はこの deploy の不変 URL (`https://<label>.<project>.pages.dev`)。
      # staging. の alias と違い、後続の push で別の deploy を指すようにならないので、e2e-staging はこちらを開く。
      # job output には secret (プロジェクト名) を含まない <label> だけを出す (上の outputs のコメント)。
      # 取り出せなくても deploy は済んでいるのでここでは落とさず、e2e-staging が空の label で落ちる。
      - name: Extract Pages deployment label for e2e-staging
        id: pages-label
        env:
          DEPLOYMENT_URL: ${{ steps.pages-deploy.outputs.deployment-url }}
        run: |
          host="${DEPLOYMENT_URL#https://}"
          label="${host%%.*}"
          if [[ "$label" =~ ^[a-z0-9-]+$ ]]; then
            echo "label=$label" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Pages の deployment-url から deployment の label を取り出せない (e2e-staging は落ちる)"
          fi

  # --------------------------------------------------------------------
  # main push: deploy した staging の配信物をブラウザで round-trip する (#655)
  # 上の e2e は手元のサーバ (vite dev / 手元の dist + wrangler dev) が相手で、secrets を入れて build した
  # 配信物・本物の staging Worker・Cloudflare の配信 (ヘッダ・CORS) の組み合わせは通らない。ここで
  # この deploy の Pages の URL に対して packages/e2e の test:deployed (tests/deployed.spec.ts) を走らせる。
  # staging は Turnstile の公開テストキーで動くので headless で通る (ADR-0049)。production には付けない。
  #
  # secrets も environment も使わない (相手は公開の URL で、検証は手元の verify-cli と配信物の /verify/)。
  # npm run setup -w @typedcode/e2e は呼ばない: 手元の workers を起こさないので .dev.vars も E2E の署名鍵も
  # 要らず、verify-cli が import する localKeys.ts (checkpoint 鍵と出題者鍵) は npm ci の postinstall
  # (scripts/ensure-local-keys.mjs) が .example から作る。E2E の鍵を verifier に足さないので、
  # staging の鍵 (registry.ts) でしか通らない状態のまま検証できる。
  # --------------------------------------------------------------------
  e2e-staging:
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      # キャッシュの組み立ては e2e-shard と同じ (キーに実際に解決された Playwright のバージョンを含める)。
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # URL は deploy-staging が出した deployment の label から組み立てる (label だけを渡す理由は
      # deploy-staging の outputs のコメント)。Pages のプロジェクトのホストは docs と同じ公開値。
      - name: Run deployed E2E against this staging deploy
        env:
          DEPLOYMENT_LABEL: ${{ needs.deploy-staging.outputs.pages-deployment-label }}
          PAGES_HOST: typedcode.pages.dev
        run: |
          if [ -z "$DEPLOYMENT_LABEL" ]; then
            echo "::error::deploy-staging が Pages の deployment の label を出していない (deployment-url を取り出せなかった)"
            exit 1
          fi
          export E2E_DEPLOYED_URL="https://${DEPLOYMENT_LABEL}.${PAGES_HOST}"
          echo "E2E_DEPLOYED_URL=$E2E_DEPLOYED_URL"
          npm run test:deployed -w @typedcode/e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-staging
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          retention-days: 7

  # --------------------------------------------------------------------
  # v* タグ push: production 環境 (Workers + Pages) を更新
  # リリース = `gh release create vX.Y.Z` によるタグ作成 (CONTRIBUTING.md 参照)。
  # GitHub Environment "production" の Required reviewers で承認待ち。
  # --------------------------------------------------------------------
  deploy-production:
    needs: [test, check, e2e]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    # 注: Environment "production" の承認待ち時間は timeout-minutes に含まれない
    # (job 開始 = 承認後)。実行時間のみの上限。
    timeout-minutes: 20
    # url は固定値 (理由は deploy-staging の environment と同じ。#667)。
    environment:
      name: production
      url: https://typedcode.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # ancestor ガード (下) が main との祖先関係を辿るため全履歴を取得する
          fetch-depth: 0

      # タグは任意のコミットに打てるため、main の履歴上のコミットであることを検証する。
      # main に載っていないコミットへのタグでは本番デプロイを拒否する。
      - name: Verify tag commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build (production API)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Merge build outputs
        run: |
          mkdir -p ./dist
          cp -r ./packages/editor/dist/* ./dist/
          cp -r ./packages/verify/dist ./dist/verify

      - name: Deploy Workers (Production)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/workers
          command: deploy --config wrangler.production.toml

      - name: Deploy to Cloudflare Pages (Production)
        # --branch=main (= Pages プロジェクトの production branch) を明示する。
        # タグ checkout は detached HEAD になり branch 推定が効かないため、
        # 省略すると preview デプロイ扱いになって本番 URL が更新されない。
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.sha }}"
