name: Freshness

# 週次の鮮度チェック。「放っておくと静かに腐る参照」をまとめて検知し、
# 結果があるときだけ Issue に集約する (毎週 Issue を増やさないよう、
# 同タイトルの open Issue があればコメント追記に切り替え、直前の報告と同じ内容なら追記もしない)。
#
# 検査項目:
#   1. リポ内 Markdown の相対リンク切れ (docs/ADR ↔ 実装のパスずれを拾う)
#   2. npm 依存の古さ (npm outdated の要約。scripts/summarize-outdated.mjs)
#   3. 本番リリースの停滞 (最新の v* タグから 30 日超 かつ 未リリースの fix / feat が 1 件以上。#410)
#      1・2 とは別の専用 Issue に出す (常設の「鮮度チェック」Issue に埋もれさせないため)
on:
  schedule:
    # 毎週月曜 00:00 UTC (= 月曜 09:00 JST)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 3 のリリース停滞検知が v* タグと <tag>..HEAD の履歴を読むため全履歴とタグが要る
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      # ------------------------------------------------------------------
      # 1. Markdown の相対リンク切れ
      #    `](...)` の対象を抽出し、ファイル/ディレクトリの実在を確認する。
      #    除外: 外部 URL・mailto/tel/data・アンカーのみ (`#...`)・
      #          サイト絶対パス (`/casual` などルーティング用でリポ内パスではない)・
      #          gitignore 対象 (`.env` / `.dev.vars` など「開発者が作る前提」の参照)
      # ------------------------------------------------------------------
      - name: Check relative Markdown links
        id: links
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/links.md"
          : > "$report"

          # shellcheck disable=SC2016 # printf の書式内の `...` は Markdown のコード表記で、展開させないための意図した単一引用符
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            while IFS= read -r raw; do
              target="${raw#](}"
              if [ -z "$target" ]; then
                continue
              fi
              case "$target" in
                http://*|https://*|//*|mailto:*|tel:*|data:*|'#'*|'<'*) continue ;;
                /*) continue ;;
              esac
              # アンカーとクエリを除いたパス部分で判定する
              target="${target%%#*}"
              target="${target%%\?*}"
              if [ -z "$target" ]; then
                continue
              fi
              if [ -e "${dir}/${target}" ]; then
                continue
              fi
              if git check-ignore -q "${dir}/${target}" 2>/dev/null; then
                continue
              fi
              printf -- '- `%s` → `%s`\n' "$file" "$target" >> "$report"
            done < <(grep -oE '\]\([^)[:space:]]*' "$file" || true)
          done < <(git ls-files '*.md')

          count="$(wc -l < "$report" | tr -d ' ')"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Broken relative links: ${count}"
          cat "$report"

      # ------------------------------------------------------------------
      # 2. npm 依存の古さ
      #    集計は scripts/summarize-outdated.mjs (純関数 + node --test。#261)。breaking の判定
      #    (0.x の minor を含む)・据え置き中の依存 (ignore リスト)・latest < current の行の除外は
      #    そちらに持つ。`--workspaces` は付けない: 付けると root の devDependencies が漏れる
      #    (フラグ無しなら root と全 workspace を拾う)。npm outdated は更新があると exit 1 を返すので
      #    `|| true` で握る。
      # ------------------------------------------------------------------
      - name: Check outdated npm dependencies
        id: deps
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/outdated.json"
          npm outdated --json > "$raw" || true
          node scripts/summarize-outdated.mjs --input "$raw" --body-file "${RUNNER_TEMP}/deps.md"

      # ------------------------------------------------------------------
      # 3. 検知結果の集約 (0 件なら Issue を作らずに終わる)
      # ------------------------------------------------------------------
      - name: Compose report
        id: report
        env:
          LINKS_COUNT: ${{ steps.links.outputs.count }}
          DEPS_COUNT: ${{ steps.deps.outputs.count }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/report.md"

          {
            echo "## 鮮度チェック結果 (${GITHUB_WORKFLOW})"
            echo
            echo "- 実行: [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- 対象コミット: \`${GITHUB_SHA}\`"
            echo
          } > "$body"

          if [ "$LINKS_COUNT" -gt 0 ]; then
            {
              echo "### 1. Markdown の相対リンク切れ (${LINKS_COUNT} 件)"
              echo
              echo "参照先が存在しません。リンク先の移動・削除に docs が追従できていない可能性があります。"
              echo
              cat "${RUNNER_TEMP}/links.md"
              echo
            } >> "$body"
          fi

          if [ "$DEPS_COUNT" -gt 0 ]; then
            {
              echo "### 2. npm 依存の古さ"
              echo
              cat "${RUNNER_TEMP}/deps.md"
              echo
            } >> "$body"
          fi

          if [ "$LINKS_COUNT" -gt 0 ] || [ "$DEPS_COUNT" -gt 0 ]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            echo "鮮度チェックの検知は 0 件。Issue は作成しません。"
          fi

      # ------------------------------------------------------------------
      # 4. Issue へ集約
      #    同タイトルの open Issue があれば新規作成せずコメント追記する
      #    (週次で Issue が増殖しないように)。
      # ------------------------------------------------------------------
      - name: Create or update freshness issue
        if: steps.report.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: 'chore: 鮮度チェックの検知結果 (自動)'
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/report.md"

          existing="$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE)] | .[0].number // empty')"

          if [ -n "$existing" ]; then
            # 直前の bot のコメント (無ければ Issue 本文) と、実行 ID と対象コミットの行を除いて
            # 同じ内容なら追記しない (毎週同じ報告で Issue を埋めない。#261)
            previous="${RUNNER_TEMP}/previous-report.md"
            gh issue view "$existing" --json body,comments \
              --jq '([.comments[] | select(.author.login == "github-actions")] | last | .body) // .body' > "$previous"
            if node scripts/summarize-outdated.mjs --same-report "$previous" "$body"; then
              echo "前回の報告と同じ内容なので、Issue #${existing} には追記しません。"
              exit 0
            fi
            echo "既存 Issue #${existing} にコメント追記します。"
            gh issue comment "$existing" --body-file "$body"
          else
            echo "新規 Issue を作成します。"
            gh issue create --title "$ISSUE_TITLE" --body-file "$body"
          fi

      # ------------------------------------------------------------------
      # 3. 本番リリースの停滞 (#410)
      #    判定は scripts/release-stall.mjs (純関数 + node --test)。1・2 の集約 (Compose report /
      #    上の Issue) には混ぜず、専用タイトルの Issue に出す。検知しても job は失敗させない。
      # ------------------------------------------------------------------
      - name: Check release stall
        id: stall
        run: node scripts/release-stall.mjs --body-file "${RUNNER_TEMP}/release-stall.md"

      - name: Create or update release stall issue
        if: steps.stall.outputs.stalled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: 'chore: 本番リリースの停滞 (自動)'
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/release-stall.md"

          existing="$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE)] | .[0].number // empty')"

          if [ -n "$existing" ]; then
            echo "既存 Issue #${existing} にコメント追記します。"
            gh issue comment "$existing" --body-file "$body"
          else
            echo "新規 Issue を作成します。"
            gh issue create --title "$ISSUE_TITLE" --body-file "$body"
          fi
