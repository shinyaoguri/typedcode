version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # 公開から 7 日経っていない版は PR にしない (#351。指定しないときの既定は 3 日)。
    # 乗っ取られたパッケージの悪意ある版は、公開から数日のうちに見つかって取り下げ
    # られることが多いので、その期間を避ける。cooldown が掛かるのは version updates だけで、security
    # updates (脆弱性の修正) には掛からないので、脆弱性の修正は遅れない。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # happy-dom causes Dependabot errors due to its package structure
      # Update manually when needed
      - dependency-name: "happy-dom"
    groups:
      # Group all production dependencies together
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # Group all dev dependencies together
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # GitHub Actions のバージョン自動更新 (action 本体が古い Node ランタイムで
  # 動いている問題などを検出できる)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # npm と同じ理由 (#351)。action も公開直後の版を避ける。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
